name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7.0.1

      # versão do pnpm vem do campo packageManager do package.json
      - uses: pnpm/action-setup@v6.1.1

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck

      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # O Android SDK já vem instalado no ubuntu-latest (ANDROID_HOME).
      - name: Prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      # Release em vez de debug: o debug espera o Metro e não embute o JS.
      # O modelo do Expo assina o release com a chave de debug, então nenhum segredo é necessário.
      # rnllamaVariants: só as variantes de CPU úteis (sem hexagon/OpenCL), corta o tempo do build.
      - name: Build do APK
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64,arm64-v8a -PrnllamaVariants=rnllama,rnllama_v8,rnllama_v8_2_dotprod,rnllama_v8_2_dotprod_i8mm,rnllama_x86_64 --no-daemon

      - uses: actions/upload-artifact@v7.0.2
        with:
          name: solis-apk
          path: apps/mobile/android/app/build/outputs/apk/release/app-release.apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Autoteste no emulador
        uses: reactivecircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            mkdir -p capturas
            adb install -r apps/mobile/android/app/build/outputs/apk/release/app-release.apk
            adb shell am start -W -n io.github.phsanalytics.solis/.MainActivity
            sleep 30
            adb exec-out screencap -p > capturas/autoteste.png
            adb exec-out uiautomator dump /dev/tty > capturas/autoteste.xml || true
            adb logcat -d > capturas/logcat.txt || true

      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: autoteste
          path: capturas/

  # Só em tag v* (ex.: git tag v1.0.0). APK de ARM 64-bit assinado com a chave de release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - uses: actions/setup-java@v6.3.0
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Prebuild
        working-directory: apps/mobile
        run: npx expo prebuild --platform android --no-install

      - name: Build do APK (arm64)
        working-directory: apps/mobile/android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a -PrnllamaVariants=rnllama,rnllama_v8,rnllama_v8_2_dotprod,rnllama_v8_2_dotprod_i8mm --no-daemon

      # A chave nunca fica no repositório: vem dos segredos e é apagada no fim.
      - name: Assinar com a chave de release
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" sign --ks "$RUNNER_TEMP/release.keystore" \
            --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "solis-${GITHUB_REF_NAME}.apk" apps/mobile/android/app/build/outputs/apk/release/app-release.apk
          rm -f "$RUNNER_TEMP/release.keystore"
          "$BT/apksigner" verify "solis-${GITHUB_REF_NAME}.apk"
          sha256sum "solis-${GITHUB_REF_NAME}.apk" > "solis-${GITHUB_REF_NAME}.apk.sha256"

      - name: Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "solis-${GITHUB_REF_NAME}.apk" "solis-${GITHUB_REF_NAME}.apk.sha256" --title "Solis $GITHUB_REF_NAME" --notes "APK para Android 64-bit (ARM). Confira o SHA-256 antes de instalar."
